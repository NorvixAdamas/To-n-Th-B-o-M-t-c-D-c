<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Hồ sơ hóa chất — Bách Khoa Bảo Mật &amp; Độc Học</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/v2.css">
  <script src="js/static-auth.js"></script>
</head>
<body class="v2" data-record="chemical">
  <header class="v2-topbar" data-topbar></header>

  <section class="v2-record-hero">
    <div class="v2-container">
      <div class="v2-breadcrumb"><a href="/dashboard.html">Tổng quan</a><span>/</span><a href="/toxicology.html">Độc học</a><span>/</span><span>Hồ sơ hóa chất</span></div>
      <span class="v2-eyebrow" style="margin-top:14px">Chemical Intelligence</span>
      <h1 id="record-title">Đang tải hồ sơ…</h1>
      <p id="record-summary" style="color:#b9cfe0;margin:0"></p>
      <div class="v2-badges" id="record-badges"></div>
      <div style="margin-top:18px"><button class="v2-btn v2-btn--ghost" type="button" onclick="window.print()" style="color:#dbeaf4;border-color:rgba(255,255,255,.25)">🖨 In hồ sơ</button></div>
    </div>
  </section>

  <main class="v2-record-layout v2-container">
    <div class="v2-card">
      <div class="v2-card__body v2-prose" id="record-content">
        <p class="v2-muted">Đang tải dữ liệu…</p>
      </div>
    </div>
    <aside class="v2-side">
      <div class="v2-card">
        <div class="v2-card__head"><h3>Thông tin định danh</h3></div>
        <div class="v2-card__body"><dl class="v2-facts" id="record-facts"></dl></div>
      </div>
      <div class="v2-card" style="margin-top:16px" id="sources-card">
        <div class="v2-card__head"><h3>Nguồn tham khảo</h3></div>
        <div class="v2-card__body" id="record-sources"><p class="v2-muted v2-small">Đang tải…</p></div>
      </div>
      <div class="v2-alert v2-alert--warn" style="margin-top:16px">
        Hồ sơ chỉ phục vụ nhận diện và phòng ngừa. Không dùng thông tin tại đây để tự điều trị; gọi 115 khi nghi ngộ độc.
      </div>
    </aside>
  </main>

  <footer class="v2-footer" data-footer></footer>
  <script src="js/core.js"></script>
  <script src="js/record.js"></script>
</body>
</html>
